# Live demo on https://timmo.dev/demos/ha-card-anchor, rendered with Home
# Assistant's embed components against mocked entities. It's read from each
# release, so it has to match that release's card.
#
# Each section starts with an anchor card, an invisible marker, as on a
# sections dashboard. The buttons in the first section add an anchor's hash to
# the page's address, and that anchor card scrolls its section into view.
entities:
  - entity_id: light.kitchen
    state: "on"
    attributes:
      friendly_name: Kitchen
      brightness: 200
      color_mode: brightness
      supported_color_modes:
        - brightness
  - entity_id: light.living_room
    state: "off"
    attributes:
      friendly_name: Living room
      color_mode: brightness
      supported_color_modes:
        - brightness
  - entity_id: climate.living_room
    state: heat
    attributes:
      friendly_name: Living room
      current_temperature: 19.5
      temperature: 21
      min_temp: 7
      max_temp: 30
      target_temp_step: 0.5
      hvac_modes:
        - "off"
        - heat
      supported_features: 1
  - entity_id: sensor.outside_temperature
    state: "8.2"
    attributes:
      friendly_name: Outside
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
  - entity_id: lock.front_door
    state: locked
    attributes:
      friendly_name: Front door
  - entity_id: binary_sensor.back_door
    state: "off"
    attributes:
      friendly_name: Back door
      device_class: door
sections:
  - cards:
      - type: heading
        heading: Jump to
      - type: button
        name: Lights
        icon: mdi:lightbulb
        show_state: false
        icon_height: 32px
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: "#anchor_lights"
      - type: button
        name: Climate
        icon: mdi:thermostat
        show_state: false
        icon_height: 32px
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: "#anchor_climate"
      - type: button
        name: Security
        icon: mdi:shield-home
        show_state: false
        icon_height: 32px
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: "#anchor_security"
  - cards:
      - type: custom:ha-card-anchor
        anchor: lights
      - type: heading
        heading: Lights
      - type: tile
        entity: light.kitchen
        features:
          - type: light-brightness
      - type: tile
        entity: light.living_room
  - cards:
      - type: custom:ha-card-anchor
        anchor: climate
      - type: heading
        heading: Climate
      - type: tile
        entity: climate.living_room
        features:
          - type: target-temperature
      - type: tile
        entity: sensor.outside_temperature
  - cards:
      - type: custom:ha-card-anchor
        anchor: security
      - type: heading
        heading: Security
      - type: tile
        entity: lock.front_door
      - type: tile
        entity: binary_sensor.back_door
